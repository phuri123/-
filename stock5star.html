<body>
<div id="splash-screen"></div>
<div id="app"></div>
<div id="toast-root"></div>

<script>
/* ---------------- Storage helpers ---------------- */
async function storeGet(key, shared){
  try{
    const r = await window.storage.get(key, !!shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function storeSet(key, value, shared){
  try{
    await window.storage.set(key, JSON.stringify(value), !!shared);
    return true;
  }catch(e){ console.error('storage set failed', e); return false; }
}

const K_USERS = 'stock5star-users';
const K_PRODUCTS = 'stock5star-products';
const K_HISTORY = 'stock5star-history';
const K_SESSION = 'stock5star-session';
const K_GAS_URL = 'stock5star-gas-url';

/* ---------------- Google Sheets (Apps Script) bridge ---------------- */
let GAS_URL = null;
let GAS_STATUS = 'unknown'; // unknown | connected | error | off

async function loadGasUrl(){
  const rec = await storeGet(K_GAS_URL, true);
  GAS_URL = rec && rec.url ? rec.url : null;
}
async function saveGasUrl(url){
  GAS_URL = url ? url.trim() : null;
  await storeSet(K_GAS_URL, {url: GAS_URL}, true);
}
function normalizeDateStr(v){
  if(v===undefined || v===null || v==='') return '';
  if(typeof v === 'number'){
    const epoch = new Date(Date.UTC(1899,11,30));
    const d = new Date(epoch.getTime() + v*86400000);
    return d.toISOString().slice(0,10);
  }
  v = String(v);
  return v.includes('T') ? v.slice(0,10) : v.slice(0,10);
}
async function gasFetchSheet(name){
  if(!GAS_URL) return null;
  try{
    const res = await fetch(GAS_URL + (GAS_URL.includes('?')?'&':'?') + 'sheet=' + encodeURIComponent(name) + '&t=' + Date.now());
    const json = await res.json();
    if(json && json.ok){ GAS_STATUS='connected'; return json.data; }
    GAS_STATUS='error';
    return null;
  }catch(e){ GAS_STATUS='error'; return null; }
}
async function gasPushSheet(name, data){
  if(!GAS_URL) return false;
  try{
    const res = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({sheet:name, data})
    });
    const json = await res.json();
    if(json && json.ok){ GAS_STATUS='connected'; return true; }
    GAS_STATUS='error';
    return false;
  }catch(e){ GAS_STATUS='error'; return false; }
}
async function testGasConnection(){
  if(!GAS_URL){ toast('กรุณาใส่ลิงก์เว็บแอปก่อน'); return; }
  toast('กำลังทดสอบการเชื่อมต่อ...');
  const data = await gasFetchSheet('Users');
  if(data!==null) toast('เชื่อมต่อ Google ชีตสำเร็จ ✅');
  else toast('เชื่อมต่อไม่สำเร็จ ตรวจสอบลิงก์และการตั้งค่า Deploy อีกครั้ง ❌');
  render();
}

/* Unified load/save: Google Sheet is source of truth when connected, local shared storage is cache/fallback */
async function loadUsers(){
  if(GAS_URL){
    const data = await gasFetchSheet('Users');
    if(data){
      const norm = data.map(u=>({username:String(u.username||''), password:String(u.password||''), role:u.role==='admin'?'admin':'employee'}));
      await storeSet(K_USERS, norm, true);
      return norm;
    }
  }
  return (await storeGet(K_USERS, true)) || [];
}
async function saveUsers(users){
  await storeSet(K_USERS, users, true);
  if(GAS_URL){ const ok = await gasPushSheet('Users', users); if(!ok) toast('บันทึกในเครื่องแล้ว แต่ส่งไป Google ชีตไม่สำเร็จ'); }
}
async function loadProducts(){
  if(GAS_URL){
    const data = await gasFetchSheet('Products');
    if(data){
      const norm = data.map(p=>({
        id:String(p.id||''), name:String(p.name||''), category:String(p.category||''),
        unit:String(p.unit||''),
        yellowQty: p.yellowQty===''||p.yellowQty===undefined||p.yellowQty===null ? null : Number(p.yellowQty),
        redQty: p.redQty===''||p.redQty===undefined||p.redQty===null ? null : Number(p.redQty),
        barcode:String(p.barcode||''), image:p.image||null
      }));
      await storeSet(K_PRODUCTS, norm, true);
      return norm;
    }
  }
  return (await storeGet(K_PRODUCTS, true)) || [];
}
async function saveProducts(products){
  await storeSet(K_PRODUCTS, products, true);
  if(GAS_URL){ const ok = await gasPushSheet('Products', products); if(!ok) toast('บันทึกในเครื่องแล้ว แต่ส่งไป Google ชีตไม่สำเร็จ'); }
}
async function loadHistory(){
  if(GAS_URL){
    const data = await gasFetchSheet('History');
    if(data){
      const norm = data.map(h=>({
        id:String(h.id||''), productId:String(h.productId||''),
        qty:Number(h.qty), diff: h.diff===''||h.diff===undefined||h.diff===null ? null : Number(h.diff),
        note:String(h.note||''), date: normalizeDateStr(h.date),
        timestamp: Number(h.timestamp)||0, by:String(h.by||'')
      }));
      await storeSet(K_HISTORY, norm, true);
      return norm;
    }
  }
  return (await storeGet(K_HISTORY, true)) || [];
}
async function saveHistory(history){
  await storeSet(K_HISTORY, history, true);
  if(GAS_URL){ const ok = await gasPushSheet('History', history); if(!ok) toast('บันทึกในเครื่องแล้ว แต่ส่งไป Google ชีตไม่สำเร็จ'); }
}

const GAS_CODE = [
'function doGet(e) {',
'  var sheetName = e.parameter.sheet;',
'  var data = readSheet_(sheetName);',
'  return jsonOut_({ok:true, data:data});',
'}',
'',
'function doPost(e) {',
'  try {',
'    var body = JSON.parse(e.postData.contents);',
'    writeSheet_(body.sheet, body.data);',
'    return jsonOut_({ok:true});',
'  } catch (err) {',
'    return jsonOut_({ok:false, error:String(err)});',
'  }',
'}',
'',
'function jsonOut_(obj) {',
'  return ContentService.createTextOutput(JSON.stringify(obj))',
'    .setMimeType(ContentService.MimeType.JSON);',
'}',
'',
'function getSheet_(name) {',
'  var ss = SpreadsheetApp.getActiveSpreadsheet();',
'  var sheet = ss.getSheetByName(name);',
'  if (!sheet) sheet = ss.insertSheet(name);',
'  return sheet;',
'}',
'',
'function readSheet_(name) {',
'  var sheet = getSheet_(name);',
'  var values = sheet.getDataRange().getValues();',
'  if (values.length < 2) return [];',
'  var headers = values[0];',
'  var rows = [];',
'  for (var i = 1; i < values.length; i++) {',
'    var row = values[i];',
'    var isEmpty = row.every(function(c) { return c === "" || c === null; });',
'    if (isEmpty) continue;',
'    var obj = {};',
'    headers.forEach(function(h, idx) { obj[h] = row[idx]; });',
'    rows.push(obj);',
'  }',
'  return rows;',
'}',
'',
'function writeSheet_(name, data) {',
'  var sheet = getSheet_(name);',
'  sheet.clearContents();',
'  if (!data || data.length === 0) return;',
'  var headerSet = {};',
'  data.forEach(function(item) {',
'    Object.keys(item).forEach(function(k) { headerSet[k] = true; });',
'  });',
'  var headers = Object.keys(headerSet);',
'  var rows = [headers];',
'  data.forEach(function(item) {',
'    var row = headers.map(function(h) {',
'      var v = item[h];',
'      if (v === undefined || v === null) return "";',
'      if (typeof v === "object") return JSON.stringify(v);',
'      return v;',
'    });',
'    rows.push(row);',
'  });',
'  sheet.getRange(1, 1, rows.length, headers.length).setValues(rows);',
'}'
].join('\n');

/* ---------------- State ---------------- */
let state = {
  booted:false,
  view:'login', // login | app
  tab:'current', // current | count | products | users | summary
  users:[],
  products:[],
  history:[],
  currentUser:null,
  loading:true,
  syncNote:'',
  loginError:'',
  loginPwdVisible:false,
  editingProductId:null,
  productImageData:null,
  scannerOpen:false,
  selectedCategory:'',
  selectedProductId:'',
  summaryMonth:'',
  registerMode:false,
  gasSetupOpen:false,
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function logoMarkHtml(opts){
  opts = opts || {};
  const cls = opts.small ? 'logo-mark small' : 'logo-mark';
  return `<div class="${cls}">
    <div class="layer-gold"></div>
    <div class="layer-red">
      <div class="logo-text">ตรา 5 ดาว</div>
      <div class="logo-stars">★★★★★</div>
    </div>
    ${opts.noReg ? '' : '<div class="reg-mark">®</div>'}
  </div>`;
}

function initSplash(){
  const el = document.getElementById('splash-screen');
  if(!el) return;
  el.innerHTML = `<div class="splash-logo">${logoMarkHtml({noReg:true})}</div>`;
  setTimeout(()=>{
    el.classList.add('splash-hide');
    setTimeout(()=>{ el.remove(); }, 850);
  }, 1300);
}

function toast(msg, ms){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), ms||2600);
}

/* Thai date helpers */
const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THAI_MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function toThaiDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
}
function monthKey(iso){ return iso ? iso.slice(0,7) : ''; }
function monthLabel(mk){
  const [y,m] = mk.split('-').map(Number);
  return `${THAI_MONTHS_FULL[m-1]} ${y+543}`;
}
function todayIso(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

/* ---------------- Boot / load ---------------- */
async function boot(){
  render();
  await loadGasUrl();
  let [users, products, history, session] = await Promise.all([
    loadUsers(),
    loadProducts(),
    loadHistory(),
    storeGet(K_SESSION, false),
  ]);
  if(!users || !users.length){
    users = [{username:'admin', password:'admin1234', role:'admin'}];
    await saveUsers(users);
  }
  state.users = users;
  state.products = products || [];
  state.history = history || [];
  state.loading = false;
  state.booted = true;
  if(session && session.username && users.find(u=>u.username===session.username)){
    state.currentUser = users.find(u=>u.username===session.username);
    state.view = 'app';
  }
  render();
}

async function refreshData(){
  state.loading = true; render();
  const [users, products, history] = await Promise.all([
    loadUsers(),
    loadProducts(),
    loadHistory(),
  ]);
  if(users) state.users = users;
  state.products = products || [];
  state.history = history || [];
  state.loading = false;
  if(GAS_URL && GAS_STATUS==='error') toast('รีเฟรชแล้ว แต่เชื่อมต่อ Google ชีตไม่สำเร็จ กำลังใช้ข้อมูลที่บันทึกไว้ล่าสุด');
  else toast('รีเฟรชข้อมูลเรียบร้อย');
  render();
}

/* ---------------- Auth ---------------- */
async function doLogin(){
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const found = state.users.find(x=>x.username===u && x.password===p);
  if(!found){
    state.loginError = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
    render();
    return;
  }
  state.currentUser = found;
  state.loginError='';
  state.view='app';

/* ---------------- Products ---------------- */
function getCategories(){
  const set = new Set(state.products.map(p=>p.category).filter(Boolean));
  return Array.from(set);
}
function currentQtyOf(productId){
  const entries = state.history.filter(h=>h.productId===productId).sort((a,b)=>a.timestamp-b.timestamp);
  if(!entries.length) return null;
  return entries[entries.length-1].qty;
}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 300;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function onProductImageChange(input){
  if(input.files && input.files[0]){
    try{
      const data = await compressImage(input.files[0]);
      state.productImageData = data;
      render();
    }catch(e){ toast('อ่านรูปภาพไม่สำเร็จ'); }
  }
}

async function saveProductForm(){
  const name = document.getElementById('p-name').value.trim();
  if(!name){ toast('กรุณาใส่ชื่อสินค้า'); return; }
  const category = document.getElementById('p-category').value.trim();
  const unit = document.getElementById('p-unit').value.trim();
  const yellowQty = document.getElementById('p-yellow').value;
  const redQty = document.getElementById('p-red').value;
  const barcode = document.getElementById('p-barcode').value.trim();
  if(state.editingProductId){
    const p = state.products.find(x=>x.id===state.editingProductId);
    Object.assign(p, {name, category, unit, yellowQty: yellowQty?Number(yellowQty):null, redQty: redQty?Number(redQty):null, barcode, image: state.productImageData||p.image||null});

/* ---------------- Count stock ---------------- */
async function saveCount(){
  const productId = document.getElementById('c-product').value;
  const qtyRaw = document.getElementById('c-qty').value;
  const date = document.getElementById('c-date').value || todayIso();
  const note = document.getElementById('c-note').value.trim();
  if(!productId){ toast('กรุณาเลือกสินค้า'); return; }
  if(qtyRaw===''){ toast('กรุณาใส่จำนวนที่นับได้'); return; }
  const qty = Number(qtyRaw);
  const prevQty = currentQtyOf(productId);
  const diff = prevQty===null ? null : qty - prevQty;
  state.history.push({
    id: uid(), productId, qty, diff, note, date,
    timestamp: Date.now(),
    by: state.currentUser ? state.currentUser.username : ''
  });
  await saveHistory(state.history);
  toast('บันทึกยอดนับเรียบร้อย');
  document.getElementById('c-qty').value='';
  document.getElementById('c-note').value='';
  render();
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){ toast('โหลดไลบรารี Excel ไม่สำเร็จ'); return; }
  const wb = XLSX.utils.book_new();
  const stockRows = state.products.map(p=>({
    'ชื่อสินค้า':p.name, 'หมวดหมู่':p.category, 'หน่วยนับ':p.unit,
    'ยอดปัจจุบัน': currentQtyOf(p.id) ?? '', 'สีเหลืองเมื่อต่ำกว่า':p.yellowQty ?? '',
    'สีแดงเมื่อต่ำกว่า':p.redQty ?? '', 'บาร์โค้ด':p.barcode||''
  }));
  wb.SheetNames.push('สต็อกปัจจุบัน');
  wb.Sheets['สต็อกปัจจุบัน'] = XLSX.utils.json_to_sheet(stockRows);
  const histRows = state.history.slice().sort((a,b)=>a.timestamp-b.timestamp).map(h=>{
    const p = state.products.find(x=>x.id===h.productId);
    return {'วันที่':toThaiDateShort(h.date), 'สินค้า':p?p.name:'(ลบแล้ว)', 'นับได้':h.qty, 'ผลต่าง':h.diff ?? '', 'หมายเหตุ':h.note||'', 'ผู้บันทึก':h.by||''};
  });
  wb.SheetNames.push('ประวัติการนับสต็อก');
  wb.Sheets['ประวัติการนับสต็อก'] = XLSX.utils.json_to_sheet(histRows);
  XLSX.writeFile(wb, 'stock5star_'+todayIso()+'.xlsx');
}

/* ---------------- Monthly summary ---------------- */
function getMonthOptions(){
  const set = new Set(state.history.map(h=>monthKey(h.date)));
  return Array.from(set).sort().reverse();
}
function computeSummary(mk){
  const rows = [];
  state.products.forEach(p=>{
    const entries = state.history.filter(h=>h.productId===p.id).sort((a,b)=>a.timestamp-b.timestamp);
    let usage = 0;
    entries.forEach(h=>{
      if(monthKey(h.date)===mk && h.diff!==null && h.diff<0){
        usage += -h.diff;
      }
    });
    if(entries.some(h=>monthKey(h.date)===mk)){
      rows.push({name:p.name, unit:p.unit, usage});
    }
  });
  return rows;
}

      </div>
    </div>
    <div class="script section-title" style="font-size:1.3em;">รายการสินค้าทั้งหมด</div>
    ${state.products.length ? state.products.map(p=>`
      <div class="product-card">
        ${p.image?`<img src="${p.image}">`:`<div style="width:48px;height:48px;background:#eee;border-radius:8px;flex-shrink:0;"></div>`}
        <div class="pinfo">
          <div style="font-weight:600;">${p.name}</div>
          <div style="font-size:.8em;color:#8a7550;">${p.category||'ไม่มีหมวดหมู่'} · ${p.unit||''}</div>
        </div>
        <div class="pactions">
          <button class="btn btn-outline btn-sm" onclick="startEditProduct('${p.id}')">แก้ไข</button>
          <button class="btn-danger" onclick="deleteProduct('${p.id}')">ลบ</button>
        </div>
      </div>
    `).join('') : `<div class="empty-box">ยังไม่มีสินค้าในระบบ</div>`}
    `;
}

function renderManageUsers(){
  return `<div class="script section-title">จัดการผู้ใช้งาน</div>
    <div class="hint">แอดมินเพิ่ม/ลบบัญชีพนักงานได้ที่นี่ พนักงานจะมีสิทธิ์แค่ดูสต็อกและนับสต็อก ลบอะไรไม่ได้</div>
    <div class="card">
      <div class="grid2">
        <div><label>ชื่อผู้ใช้</label><input type="text" id="u-username" placeholder="ชื่อผู้ใช้"></div>
        <div><label>รหัสผ่าน</label><input type="text" id="u-password" placeholder="รหัสผ่าน"></div>
      </div>
      <label>สิทธิ์การใช้งาน</label>
      <select id="u-role">
        <option value="employee">พนักงาน (นับสต็อกอย่างเดียว)</option>
        <option value="admin">แอดมิน (สิทธิ์เต็ม)</option>
      </select>
      <div style="margin-top:16px; text-align:right;">
        <button class="btn btn-gold" onclick="addUserForm()">+ เพิ่มผู้ใช้</button>
      </div>
    </div>
    ${state.users.map(u=>`
      <div class="user-card">
        <div>
          <div style="font-weight:600;">${u.username}</div>
          <span class="badge ${u.role==='admin'?'badge-admin':'badge-emp'}">${u.role==='admin'?'แอดมิน':'พนักงาน'}</span>
        </div>
        <button class="btn-danger" onclick="deleteUser('${u.username}')">ลบ</button>
      </div>
    `).join('')}
  `;
}

function renderSummary(){
  const months = getMonthOptions();
  if(!state.summaryMonth && months.length) state.summaryMonth = months[0];
  const rows = state.summaryMonth ? computeSummary(state.summaryMonth) : [];
  return `<div class="script section-title">สรุปการใช้สต็อกรายเดือน</div>
    <div class="hint">คำนวณจากยอดสต็อกที่ลดลงระหว่างการนับแต่ละครั้ง (ไม่ใช่ยอดขายจริง เพราะระบบนี้ไม่มีข้อมูลราคา/ยอดขาย)</div>
    <div style="margin-bottom:14px;">
      <label style="display:inline-block;margin:0 10px 0 0;">เลือกเดือน:</label>
      <select style="width:auto;display:inline-block;" onchange="state.summaryMonth=this.value; render();">
        ${months.length ? months.map(m=>`<option value="${m}" ${state.summaryMonth===m?'selected':''}>${monthLabel(m)}</option>`).join('') : `<option>ยังไม่มีข้อมูล</option>`}
      </select>
    </div>
    <div class="card">
      ${rows.length ? `
        <table><thead><tr><th>สินค้า</th><th>ใช้ไปประมาณ</th><th>หน่วย</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.name}</td><td>${r.usage}</td><td>${r.unit||''}</td></tr>`).join('')}</tbody></table>
      ` : `<div class="empty-box">ยังไม่มีข้อมูลการนับสต็อกให้สรุป</div>`}
    </div>`;
}

function openGasSetup(){ state.gasSetupOpen = true; render(); }
function closeGasSetup(){ state.gasSetupOpen = false; render(); }
async function saveGasSetupForm(){
  const url = document.getElementById('gas-url-input').value.trim();
  await saveGasUrl(url);
  if(url){
    toast('บันทึกลิงก์แล้ว กำลังโหลดข้อมูลจาก Google ชีต...');
    await refreshData();
  } else {
    toast('ยกเลิกการเชื่อมต่อ Google ชีต ใช้ข้อมูลในเครื่องแทน');
    render();
  }
}
function copyGasCode(){
  const ta = document.getElementById('gas-code-box');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try{
    navigator.clipboard.writeText(GAS_CODE).then(()=>toast('คัดลอกโค้ดแล้ว')).catch(()=>toast('คัดลอกไม่สำเร็จ กรุณาเลือกข้อความแล้วกด Ctrl/Cmd+C เอง'));
  }catch(e){
    try{ document.execCommand('copy'); toast('คัดลอกโค้ดแล้ว'); }
    catch(e2){ toast('คัดลอกไม่สำเร็จ กรุณาเลือกข้อความแล้วกด Ctrl/Cmd+C เอง'); }
  }
}
function renderGasSetupModal(){
  const statusText = !GAS_URL ? 'ยังไม่ได้เชื่อมต่อ (ใช้ข้อมูลในเครื่อง)'
    : GAS_STATUS==='connected' ? 'เชื่อมต่อ Google ชีตอยู่ ✅'
    : GAS_STATUS==='error' ? 'ตั้งค่าไว้แล้ว แต่เชื่อมต่อไม่สำเร็จ ❌'
    : 'ตั้งค่าไว้แล้ว';
  return `<div class="modal-overlay" id="gas-overlay">
    <div class="modal-box" style="max-width:560px;max-height:88vh;overflow-y:auto;">
      <button class="modal-close" onclick="closeGasSetup()">✕</button>
      <div class="script" style="font-size:1.6em;margin-bottom:6px;">เชื่อมต่อ Google ชีต</div>
      <div class="small-note" style="margin-bottom:14px;">สถานะ: ${statusText}</div>
      <div class="hint" style="margin-bottom:10px;">
        1) เปิด Google ชีตใหม่ (หรือชีตเดิมที่จะใช้เก็บข้อมูล)<br>
        2) เมนู ส่วนขยาย (Extensions) → Apps Script<br>
        3) ลบโค้ดเดิมทั้งหมด แล้ววางโค้ดด้านล่างนี้แทน<br>
        4) กด Deploy → New deployment → เลือกประเภท "Web app"<br>
        5) ตั้งค่า Execute as = "Me", Who has access = "Anyone"<br>
        6) กด Deploy แล้วคัดลอกลิงก์ (URL) ที่ได้มาวางไว้ด้านล่าง
      </div>
      <label>โค้ด Apps Script (คัดลอกไปวางในสคริปต์)</label>
      <textarea id="gas-code-box" readonly rows="6" style="font-family:monospace;font-size:.75em;">${GAS_CODE.replace(/</g,'&lt;')}</textarea>
      <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="copyGasCode()">คัดลอกโค้ด</button>
      <label style="margin-top:18px;">ลิงก์เว็บแอปที่ได้จากการ Deploy</label>
      <input type="text" id="gas-url-input" placeholder="https://script.google.com/macros/s/xxxxx/exec" value="${GAS_URL||''}">
      <div class="small-note">เว้นว่างแล้วกดบันทึก หากต้องการเลิกใช้ Google ชีตและกลับไปใช้ข้อมูลในเครื่อง</div>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
        <button class="btn btn-outline btn-sm" onclick="testGasConnection()">ทดสอบการเชื่อมต่อ</button>
        <button class="btn btn-gold btn-sm" onclick="saveGasSetupForm()">บันทึก</button>
      </div>
    </div>
  </div>`;
}

function renderScannerModal(){
  return `<div class="modal-overlay" id="scanner-overlay">
    <div class="modal-box">
      <button class="modal-close" onclick="closeScanner()">✕</button>
      <div class="script" style="font-size:1.6em;margin-bottom:10px;">สแกนบาร์โค้ด</div>
      <div id="scanner-video-wrap"><div id="scanner-region"></div></div>
      <div class="center" style="margin-top:12px;font-size:.9em;">เล็งกล้องไปที่บาร์โค้ดสินค้า</div>
    </div>
  </div>`;
}

/* remove any stray modal overlays before re-render to avoid duplicates */
const _origRender = render;
render = function(){
  document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
  _origRender();
};

initSplash();
boot();
</script>
</body>
</html>
